services:
  postgres:
    image: postgres:16-alpine
    container_name: dendona-postgres
    environment:
      POSTGRES_DB: dendona
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dendona"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dendona-redis
    volumes:
      - redis_data:/data

  app:
    build: .
    container_name: dendona-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - /app/__pycache__
      - uploads_data:/app/uploads
    environment:
      - PYTHONPATH=/app

  frontend:
    build: ./frontend
    container_name: dendona-frontend
    depends_on:
      - app

  nginx:
    image: nginx:alpine
    container_name: dendona-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  letsencrypt: