upstream backend {
    server app:8000;
}

upstream frontend {
    server frontend:80;
}

# HTTP → HTTPS redirects
server {
    listen 80;
    server_name avito.dendona.ru api-avito.dendona.ru;
    return 301 https://$host$request_uri;
}

# Frontend — avito.dendona.ru
server {
    listen 443 ssl http2;
    server_name avito.dendona.ru;

    ssl_certificate     /etc/letsencrypt/live/avito.dendona.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avito.dendona.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    location / {
        proxy_pass http://frontend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# API — api-avito.dendona.ru
server {
    listen 443 ssl http2;
    server_name api-avito.dendona.ru;

    ssl_certificate     /etc/letsencrypt/live/api-avito.dendona.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-avito.dendona.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    location /static/ {
        proxy_pass http://backend/static/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS
        add_header Access-Control-Allow-Origin "https://avito.dendona.ru" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}